name: Inspect Argo-Nezha

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Pull image
        run: |
          docker pull mikehand888/argo-nezha:latest

      - name: Export image filesystem
        run: |
          docker create --name argo-temp mikehand888/argo-nezha:latest
          docker export argo-temp -o filesystem.tar

      - name: Inspect dashboard
        run: |
          mkdir rootfs
          tar -xf filesystem.tar -C rootfs

          echo "===== ROOT ====="
          find rootfs -maxdepth 2 -type f | sort

          echo "===== DASHBOARD ====="
          find rootfs/dashboard -maxdepth 5 -type f 2>/dev/null | sort || true

          echo "===== POSSIBLE BINARIES ====="
          find rootfs -type f \( \
            -name "app" -o \
            -name "caddy" -o \
            -name "cloudflared" -o \
            -name "nezha-agent" \
          \) 2>/dev/null | sort || true

      - name: Upload filesystem
        uses: actions/upload-artifact@v4
        with:
          name: argo-nezha-filesystem
          path: filesystem.tar
