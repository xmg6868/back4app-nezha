 name: Start Argo-Nezha
 run: |
    docker run -d \
      --name argo-nezha \
      -e GH_USER="${{ secrets.GH_USER }}" \
      -e GH_CLIENTID="${{ secrets.GH_CLIENTID }}" \
      -e GH_CLIENTSECRET="${{ secrets.GH_CLIENTSECRET }}" \
      -e GH_BACKUP_USER="${{ secrets.GH_BACKUP_USER }}" \
      -e GH_REPO="${{ secrets.GH_REPO }}" \
      -e GH_EMAIL="${{ secrets.GH_EMAIL }}" \
      -e GH_PAT="${{ secrets.GH_PAT }}" \
      -e ARGO_AUTH="${{ secrets.ARGO_AUTH }}" \
      -e ARGO_DOMAIN="${{ secrets.ARGO_DOMAIN }}" \
      -e PRO_PORT="18391" \
      -e REVERSE_PROXY_MODE="caddy" \
      -e DASHBOARD_VERSION="" \
      -e AGENT_VERSION="" \
      -e NO_AUTO_RENEW="1" \
      -e BACKUP_TIME="0 4 * * *" \
      -e BACKUP_NUM="5" \
      -p 18391:18391 \
      --entrypoint /bin/sh \
      mikehand888/argo-nezha:latest \
      -c 'bash /dashboard/entrypoint.sh > /tmp/init.log 2>&1 & echo $! > /tmp/init.pid; tail -f /dev/null'

  name: Wait for installation
 run: |
    for i in $(seq 1 90); do
      echo "===== $i/90 ====="

      docker exec argo-nezha sh -c '
        echo "--- init log ---"
        tail -50 /tmp/init.log 2>/dev/null || true
        echo "--- dashboard ---"
        ls -lah /dashboard 2>/dev/null || true
      ' || true

      if docker exec argo-nezha sh -c '
        test -x /dashboard/app &&
        test -x /dashboard/caddy &&
        test -x /dashboard/nezha-agent &&
        test -f /dashboard/Caddyfile &&
        test -d /dashboard/data
      '; then
        echo "安装完成"
        exit 0
      fi

      sleep 10
    done

    echo "安装超时"
    exit 1
