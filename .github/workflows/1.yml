name: Get Argo Nezha init.sh

on:
  workflow_dispatch:

jobs:
  get:
    runs-on: ubuntu-latest

    steps:
      - name: Download init.sh
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Kiritocyz/Argo-Nezha-Service-Container/main/init.sh \
            -o init.sh

      - name: Show init.sh
        run: |
          echo "===== init.sh ====="
          cat init.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: init-script
          path: init.sh
